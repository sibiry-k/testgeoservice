volumes:
  pg_data:

services:
  db:
    image: postgres:16.4
    container_name: DataBase
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/pg_data
  local_service:
    build: ./src/
    container_name: LocalService
    env_file:
      - .env
    depends_on:
      - db
  remote_service:
    container_name: RemoteService
    build: ./remote_service/
    ports:
      - '9000:9000'
  gateway:
    image: nginx
    container_name: gateway
    volumes:
      - type: bind
        source: nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - '8000:80'
    depends_on:
      - remote_service
